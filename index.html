<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPA App Server</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      text-align: center;
      max-width: 480px;
      width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: #10b981;
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    button {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #059669;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .output-box {
      margin-top: 1.5rem;
      min-height: 24px;
      font-size: 0.95rem;
      color: #6ee7b7;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="badge">Version 1.0.0</div>
    <h1>⚡ RPA Saurabh new df,jfjb </h1>
    <p>Welcome! This application manages automated workflows and tasks.</p>
    <button id="actionBtn" type="button">Click to Run Task</button>
    <div id="output" class="output-box"></div>
  </div>

  <script>
    document.getElementById('actionBtn').addEventListener('click', () => {
      document.getElementById('output').textContent = 'Task triggered successfully.';
    });
  </script>
</body>

</html>
