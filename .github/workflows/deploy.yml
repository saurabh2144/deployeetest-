name: Deploy to Main RPA Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    env:
      DEPLOY_PATH: E:\deployeetest-
      APP_NAME: rpa-server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Files & Reload PM2
        shell: powershell
        run: |
          Write-Host "Copying files to $env:DEPLOY_PATH..."
          Copy-Item -Path index.html, style.css, server.js -Destination "$env:DEPLOY_PATH\" -Force -ErrorAction SilentlyContinue
          
          Write-Host "Reloading PM2 process..."
          npx pm2 restart $env:APP_NAME
          
          Write-Host "Deployment completed successfully!"
